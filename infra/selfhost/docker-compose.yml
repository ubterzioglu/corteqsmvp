# CorteQS — kendi altyapımızda çalışan veri katmanı (Supabase Cloud'a alternatif)
#
# Tasarım kararı: bu, "Supabase self-host" dağıtımı DEĞİLDİR. Yalnız uygulamanın
# GERÇEKTEN kullandığı açık kaynak bileşenler kurulur. Ölçüm: docs/supabase-exit-plan.md
#
# KURULMAYANLAR ve nedenleri:
#   kong / envoy  -> yol yönlendirmeyi kendi nginx geçidimiz yapar (gateway servisi)
#   studio        -> uygulama bağlanmıyor; ek saldırı yüzeyi
#   analytics     -> (logflare) uygulama bağlanmıyor; en çok RAM yiyen servis
#   supavisor     -> tek uygulama + PostgREST kendi havuzunu tutar
#   postgres-meta -> yalnız Studio için gerekir
#   imgproxy      -> ÖLÇÜLDÜ: kodda 0 görsel dönüşümü çağrısı var
#
# ⚠️ Postgres portu DIŞARI AÇILMAZ. 2026-08-05'te bırakılan bir kopyada 5432 açık
#    kaldı ve 46 gün boyunca üretim verisi internete açık durdu. Tekrarlamıyoruz.

name: corteqs-data

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- Postgres
  db:
    # Postgres + eklentiler (postgis, pg_cron, pg_net, pgcrypto, pg_trgm, unaccent)
    # + anon/authenticated/service_role/authenticator/supabase_* rollerinin bootstrap'ı.
    # 2026-08-05 denemesi tam da bunlar eksik olduğu için çöktü (0 grant, 0 rol,
    # auth.uid() mock). Çıplak postgres imajı YETMEZ.
    # Faz 9'da kendi imajımıza geçiş için: infra/selfhost/postgres/README.md
    image: supabase/postgres:17.6.1.136
    container_name: corteqs-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      # Realtime logical replication'a ihtiyaç duyar.
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # pg_cron + pg_net yalnız preload edilirse çalışır.
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_cron,pg_net
      - -c
      - cron.database_name=${POSTGRES_DB:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Restore ÖNCESİ çalışan, idempotent hazırlık (yalnız ilk açılışta).
      - ./postgres/init:/docker-entrypoint-initdb.d/custom:ro
    # ⚠️ Port BİLEREK yayınlanmıyor. Yerel hata ayıklama için yalnız loopback'e bağla:
    #   ports: ["127.0.0.1:54322:5432"]
    # Üretimde bu satır ASLA açılmaz.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --------------------------------------------------------------- PostgREST
  # 457 `.from()` + 143 `.rpc()` çağrısının karşılığı. MIT, bağımsız proje.
  rest:
    image: postgrest/postgrest:v14.17
    container_name: corteqs-rest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      # storage şeması, storage-api'nin PostgREST üzerinden çalışması için gerekir.
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      # ⚠️ 1000 varsayılanı CorteQS'te bilinen bir tuzak (CLAUDE.md "Değişmez
      # sözleşmeler" md.5): PostgREST sessizce keser, hata dönmez. Supabase Cloud
      # da 1000 kullanıyor — DEĞİŞTİRME, yoksa canlı ile davranış farkı oluşur ve
      # sayfalama hataları burada gizlenip canlıda ortaya çıkar.
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: "*"
    healthcheck:
      # PostgREST imajında curl/wget yok; kendi admin sunucusunu kullanıyoruz.
      test: ["CMD", "postgrest", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------ GoTrue (auth)
  # 56 auth.users FK'si ve 540 auth.uid() kullanımının dayandığı servis.
  auth:
    # ⚠️ SÜRÜM CANLIDAN GERİ OLAMAZ. Ölçüldü 2026-09-20: Supabase Cloud
    #    /auth/v1/health → v2.197.0. Daha eski bir GoTrue, restore edilmiş auth
    #    şemasını "gelecekten gelmiş" görür ve açılışta migration hatası verir.
    #    Yükseltirken önce canlı sürümü tekrar ölç.
    image: supabase/gotrue:v2.197.0
    container_name: corteqs-auth
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?API_EXTERNAL_URL zorunlu}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

      GOTRUE_SITE_URL: ${SITE_URL:?SITE_URL zorunlu}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      # ⚠️ JWT_SECRET, Supabase projesindeki JWT secret ile AYNI olmalıdır.
      # O zaman mevcut anon key değişmeden çalışır ve kullanıcı oturumları DÜŞMEZ.
      # Farklı bir secret verirsen herkes anında çıkış yapmış olur.
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      # ⚠️ Mevcut token'ların doğrulanmaya devam etmesi için issuer da eşleşmeli.
      # Supabase Cloud'da bu "https://<ref>.supabase.co/auth/v1" biçimindedir.
      GOTRUE_JWT_ISSUER: ${JWT_ISSUER:-${API_EXTERNAL_URL}/auth/v1}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-false}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-false}

      # Google OAuth — kodda kullanılan TEK sağlayıcı (7 çağrı noktası).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_OAUTH:-true}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_OAUTH_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback

      # SMTP — mevcut Zoho hesabı. MAIL_FROM, Zoho hesabının kendisi veya alias'ı
      # OLMAK ZORUNDA, aksi halde 553 döner (.env.example'daki mevcut not).
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-CorteQS}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------- storage-api
  # 7 bucket: avatars, burak-share, cadde-media, profile-cv-files,
  # profile-presentation-files, revision-attachments, whatsapp-landing-hero
  storage:
    # Ölçüldü 2026-09-20: Supabase Cloud /storage/v1/version → 1.73.1.
    # Bizimki ileri yönde (1.74.0) — restore sonrası kendi migration'larını uygular.
    image: supabase/storage-api:v1.74.0
    container_name: corteqs-storage
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY:?ANON_KEY zorunlu}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY zorunlu}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${API_EXTERNAL_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # 50 MB — koddaki en yüksek sınır (src/lib/security.ts ARGE_MAX_FILE_SIZE).
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      # S3/MinIO GEREKMİYOR: 480 GB yerel disk doğrudan kullanılıyor.
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-corteqs}
      REGION: ${REGION:-eu-central-1}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-corteqs}
      # ÖLÇÜLDÜ: kodda 0 görsel dönüşümü çağrısı → imgproxy kurulmuyor.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------- Realtime
  # Yalnız 3 postgres_changes aboneliği için. Broadcast/presence KULLANILMIYOR.
  # İlk aşamada kapatılabilir: `docker compose --profile realtime up` ile açılır.
  realtime:
    image: supabase/realtime:v2.134.10
    container_name: corteqs-realtime
    restart: unless-stopped
    logging: *default-logging
    profiles: ["realtime", "full"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?REALTIME_DB_ENC_KEY zorunlu}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE zorunlu}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  # ----------------------------------------------------------------- Gateway
  # Kong'un yerine geçer: yol yönlendirme + apikey kontrolü + rate limit.
  # Coolify bunun önünde TLS'i sonlandırır; bu yüzden burada TLS yok.
  gateway:
    image: nginx:1.27-alpine
    container_name: corteqs-gateway
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      rest: { condition: service_started }
      auth: { condition: service_started }
      storage: { condition: service_started }
    environment:
      # nginx imajının 20-envsubst-on-templates.sh scripti bunları template'e basar.
      # ⚠️ Değişken adları bilerek dar seçildi (CLAUDE.md md.3 ile aynı gerekçe):
      # genel adlar envsubst'ta ortam değişkenleriyle çakışır.
      CORTEQS_ANON_KEY: ${ANON_KEY}
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      # Yalnız Coolify'ın ters proxy'si bu porta ulaşır.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
    name: corteqs-db-data
  storage-data:
    name: corteqs-storage-data
