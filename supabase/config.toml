project_id = "injprdrsklkxgnaiixzh"

[functions.find-matches]
verify_jwt = true

[functions.send-submission-email]
verify_jwt = true

[functions.lansman-admin]
verify_jwt = true

[functions.submit-survey-response]
verify_jwt = false

# Public directory search is anonymous. The function itself requires an allowed
# browser Origin, enforces a shared IP rate limit, and validates a bounded body.
[functions.directory-search]
verify_jwt = false

# Gateway JWT doğrulaması KAPALI, çünkü fonksiyon DB'den pg_net ile de çağrılır ve
# net.http_post bir kullanıcı JWT'si taşıyamaz. Yetki fonksiyonun kendi içinde yapılır:
# ya x-dispatch-secret (NOTIFY_DISPATCH_SECRET ile sabit zamanlı karşılaştırma)
# ya da geçerli bir admin JWT'si (getUser + is_admin RPC). İkisi de yoksa 401 döner.
[functions.send-notification-emails]
verify_jwt = false

# A99-R2 kök nedeni: pg_cron her sabah 05:00'te bu fonksiyonu
# `Authorization: Bearer <vault:radar_news_cron_secret>` ile çağırıyor — yani HAM
# SECRET, JWT değil. verify_jwt AÇIKken ağ geçidi bu ham secret'ı JWT diye doğrulamaya
# çalışıp 401 döner; istek fonksiyon koduna HİÇ ulaşmaz. Sonuç: koşu satırı açılmaz,
# f6b5c6f'teki bayat-kilit düzeltmesi çalışamaz, Radar 14.09'dan beri ölü kalır
# (cron.job_run_details ise yalnız http_post kuyruğa alındığı için 'succeeded' yazar).
# Yetki zaten fonksiyonun içinde: RADAR_NEWS_CRON_SECRET karşılaştırması (cron) ya da
# getUser + is_admin (manuel/admin panel). İkisi de yoksa 401 (index.ts:74-108).
# Aynı desen: send-notification-emails, whatsapp-webhook.
[functions.radar-news-scan]
verify_jwt = false

# Meta gateway Supabase JWT gondermez. GET verify token ve POST HMAC-SHA256
# dogrulamasi fonksiyonun kendi icinde zorunludur.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-reply]
verify_jwt = true
