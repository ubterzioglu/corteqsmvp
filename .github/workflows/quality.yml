name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SG10: SHA'ya sabitleme (supply chain koruması)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:quality
      - run: npm run lint
      - run: npm run test -- --maxWorkers=4
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:dead
      - run: npm run check:drift
      - run: npm run ingest:tools:check
