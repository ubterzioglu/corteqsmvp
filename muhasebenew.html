<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorteQS · Bütçe Modülü</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F4; --panel:#FFFFFF; --panel2:#EEF1EA; --line:#DFE5DB; --line2:#C7D1C3;
  --ink:#1E2B24; --muted:#5F6E64; --dim:#8A9990;
  --brass:#A87718; --brass-soft:rgba(168,119,24,.10);
  --pos:#1F7A4D; --neg:#C24434; --pos-soft:rgba(31,122,77,.08); --neg-soft:rgba(194,68,52,.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Archivo',sans-serif; --body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
::selection{background:var(--brass-soft)}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.02em}
.logo span{color:var(--brass)}
.logo small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.hspace{flex:1}
.year-wrap{display:flex;align-items:center;gap:8px}
.year-wrap label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--brass)}
.savestate{font-family:var(--mono);font-size:11px;color:var(--dim)}
.savestate.saved{color:var(--pos)}
button{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:7px 12px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer}
button:hover{border-color:var(--brass);color:var(--brass)}
button.primary{background:var(--brass);border-color:var(--brass);color:#FFFFFF}
button.primary:hover{filter:brightness(1.08);color:#FFFFFF}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 6px}
button.ghost:hover{color:var(--neg);border-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

/* ---------- Tabs ---------- */
nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:12px 14px;white-space:nowrap;font-weight:600}
nav button:hover{color:var(--ink)}
nav button.active{color:var(--brass);border-bottom-color:var(--brass)}

/* ---------- Layout ---------- */
main{padding:20px;max-width:1600px;margin:0 auto}
.screen{display:none}
.screen.active{display:block}
h2{font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}

/* ---------- Cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card .v{font-family:var(--mono);font-size:20px;font-weight:600}
.card .v.pos{color:var(--pos)} .card .v.neg{color:var(--neg)} .card .v.brass{color:var(--brass)}
.card .n{font-size:11px;color:var(--dim);margin-top:4px}

/* ---------- Tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:1280px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;background:var(--panel2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:2;border-right:1px solid var(--line);max-width:210px;min-width:170px;white-space:normal}
th:first-child{background:var(--panel2);z-index:3}
td{text-align:right;font-family:var(--mono)}
td input[type=number]{width:72px;text-align:right;padding:4px 5px;font-size:12px;border-color:var(--line)}
td input[type=number]:hover{border-color:var(--line2)}
td input.actual-in{border-style:dashed}
tr.item-plan td{border-bottom:none;padding-bottom:2px}
tr.item-actual td{padding-top:2px;color:var(--muted)}
.rowlabel{font-family:var(--body);font-weight:600;font-size:13px}
.rowtag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-left:6px}
tr.sumrow td{background:var(--panel2);font-weight:600;border-top:1px solid var(--line2)}
tr.sumrow td:first-child{background:var(--panel2)}
tr.sumrow.alloc td{color:var(--brass)}
tr.sumrow.kalan td.pos{color:var(--pos)} tr.sumrow.kalan td.neg{color:var(--neg)}
td.pos{color:var(--pos)} td.neg{color:var(--neg)}
tr.grand td{background:var(--brass-soft);font-weight:700;border-top:2px solid var(--brass)}
tr.section-head td{background:var(--bg);color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding-top:12px}
td input.name-in{width:100%;font-family:var(--body);font-weight:600;text-align:left;background:transparent;border-color:transparent}
td input.name-in:hover,td input.name-in:focus{border-color:var(--line2);background:var(--panel2)}
select.cur-sel,select.mini{padding:3px 4px;font-size:11px}
td input.mini-in{width:64px}

/* ---------- Allocation strip ---------- */
.allocbox{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.allocbox .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- Runway ledger (signature) ---------- */
.runway{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
.runway h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.rw-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:120px}
.rw-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.rw-bar{width:100%;border-radius:3px 3px 0 0;background:var(--pos);min-height:2px;transition:height .4s ease}
.rw-bar.neg{background:var(--neg);border-radius:0 0 3px 3px}
.rw-m{font-family:var(--mono);font-size:9px;color:var(--dim)}
.rw-v{font-family:var(--mono);font-size:9px;color:var(--muted)}
.rw-meta{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap}
.rw-meta div{font-family:var(--mono);font-size:12px}
.rw-meta .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:2px}

/* ---------- Params ---------- */
.params{display:flex;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.param{display:flex;flex-direction:column;gap:4px}
.param label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.param input{width:110px}

.hint{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.rw-bar{transition:none}}
@media (max-width:720px){main{padding:12px}.card .v{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="logo">CorteQS<span>.</span><small>Bütçe Konsolu · The System</small></div>
  <div class="hspace"></div>
  <div class="year-wrap">
    <label for="yearSel">Yıl</label>
    <select id="yearSel"></select>
  </div>
  <button id="csvBtn">CSV indir</button>
  <span class="savestate" id="saveState">·</span>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
/* ================= CorteQS Bütçe Motoru ================= */
const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const YEARS = ["2026","2027","2028"];
const STORE_KEY = "corteqs-budget-v1";
const CURS = ["USD","EUR","TRY"];

const DEPTS = [
  {id:"tech", name:"Teknoloji & Altyapı", sub:"Tool'lar, server, domain, AI kredileri", seeds:[
    ["Lovable aboneliği","USD"],["Supabase","USD"],["Domain & DNS","USD"],
    ["AI kredileri (video/görsel)","USD"],["E-posta servisi","USD"],["API & diğer altyapı","USD"]]},
  {id:"mkt", name:"Pazarlama & Sosyal Medya", sub:"Reklam, içerik, influencer, etkinlik pazarlama", seeds:[
    ["Meta reklam","USD"],["Google reklam","USD"],["TikTok reklam","USD"],
    ["İçerik üretimi","USD"],["Influencer / Elçi","EUR"],["Etkinlik pazarlama","EUR"]]},
  {id:"hr", name:"Personel & Ortaklık", sub:"Maaş, freelancer, equity nakit bileşeni, SGK & stopaj", seeds:[
    ["Maaşlar (brüt)","TRY"],["Freelancer ödemeleri","USD"],
    ["Equity anlaşmaları — nakit bileşeni","USD"],["SGK & stopaj","TRY"]]},
  {id:"admin", name:"İdari & Compliance", sub:"Delaware, muhasebe, hukuk, banka, tescil", seeds:[
    ["Delaware franchise tax","USD"],["Registered agent","USD"],["ABD muhasebe & beyanname","USD"],
    ["Hukuk & KVKK/GDPR","USD"],["Marka tescili (TR + EU)","USD"],["Banka masrafları","USD"],["Sigorta","USD"]]}
];

const REV_SEEDS = [
  ["Subscription", 5, 7.5],
  ["Cadde reklam", 250, 3.5],
  ["Çarşı komisyonu", 1, 5],
  ["Etkinlik", 25, 3.5],
  ["Ana sponsor", 1000, 3.5],
  ["Diğer 1", 0, 0],
  ["Diğer 2", 0, 0]
];

let state = null;
let saveTimer = null;
let uid = () => Math.random().toString(36).slice(2,9);
const z12 = () => Array(12).fill(0);

function seedYear(){
  const y = { fx:{EUR:1.08, TRY:0.024}, opening:0, basis:"plan", expenses:{}, revenue:[], alloc:{} };
  DEPTS.forEach(d=>{
    y.expenses[d.id] = d.seeds.map(s=>({id:uid(), name:s[0], cur:s[1], plan:z12(), actual:z12()}));
    y.alloc[d.id] = {mode:"fixed", fixed:z12(), pct:0};
  });
  y.revenue = REV_SEEDS.map(r=>({id:uid(), name:r[0], price:r[1], comm:r[2], qty:z12()}));
  return y;
}

function defaultState(){
  return { activeYear:"2026", activeTab:"tech", years:{ "2026": seedYear() } };
}

async function loadState(){
  try{
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value){ state = JSON.parse(r.value); return; }
  }catch(e){/* anahtar yok — ilk açılış */}
  state = defaultState();
}

function scheduleSave(){
  const el = document.getElementById("saveState");
  el.textContent = "kaydediliyor…"; el.classList.remove("saved");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(STORE_KEY, JSON.stringify(state));
      el.textContent = "kaydedildi"; el.classList.add("saved");
    }catch(e){ el.textContent = "kayıt hatası"; }
  }, 700);
}

/* ---------- helpers ---------- */
const Y = () => state.years[state.activeYear];
const fx = cur => cur==="USD" ? 1 : (Number(Y().fx[cur])||0);
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const fmt = n => { const v = Math.round(num(n));
  return v.toLocaleString("en-US"); };
const fmtS = n => (num(n)<0?"−":"") + fmt(Math.abs(n));

function deptPlanUSD(id,m){ return Y().expenses[id].reduce((s,it)=>s+num(it.plan[m])*fx(it.cur),0); }
function deptActualUSD(id,m){ return Y().expenses[id].reduce((s,it)=>s+num(it.actual[m])*fx(it.cur),0); }
function revGross(m){ return Y().revenue.reduce((s,r)=>s+num(r.qty[m])*num(r.price),0); }
function revComm(m){ return Y().revenue.reduce((s,r)=>s+num(r.qty[m])*num(r.price)*num(r.comm)/100,0); }
function revNet(m){ return revGross(m)-revComm(m); }
function allocUSD(id,m){
  const a = Y().alloc[id];
  return a.mode==="pct" ? revNet(m)*num(a.pct)/100 : num(a.fixed[m]);
}

/* ---------- tabs ---------- */
const TABS = [...DEPTS.map(d=>({id:d.id,name:d.name})),
  {id:"rev", name:"Platform Gelirleri"},
  {id:"cons", name:"Konsolide Nakit Akışı"}];

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t.name;
    b.className = state.activeTab===t.id ? "active" : "";
    b.onclick = ()=>{ state.activeTab = t.id; renderAll(); scheduleSave(); };
    nav.appendChild(b);
  });
}

function renderYearSel(){
  const s = document.getElementById("yearSel");
  s.innerHTML = "";
  YEARS.forEach(yr=>{
    const o = document.createElement("option");
    o.value = yr; o.textContent = yr;
    if(yr===state.activeYear) o.selected = true;
    s.appendChild(o);
  });
  s.onchange = ()=>{
    state.activeYear = s.value;
    if(!state.years[s.value]) state.years[s.value] = seedYear();
    renderAll(); scheduleSave();
  };
}

/* ---------- month input row ---------- */
function monthInputs(arr, cls, onch){
  return arr.map((v,m)=>{
    const td = document.createElement("td");
    const inp = document.createElement("input");
    inp.type = "number"; inp.step = "any"; inp.className = cls;
    inp.value = v===0 ? "" : v; inp.placeholder = "0";
    inp.setAttribute("aria-label", MONTHS[m]);
    inp.oninput = ()=>{ arr[m] = num(inp.value); onch(); scheduleSave(); };
    td.appendChild(inp);
    return td;
  });
}

function headerRow(extra){
  const tr = document.createElement("tr");
  const cells = ["Kalem", ...(extra||[]), ...MONTHS, "Toplam", ""];
  cells.forEach(c=>{ const th=document.createElement("th"); th.textContent=c; tr.appendChild(th); });
  return tr;
}

/* ---------- department screens ---------- */
function renderDept(d, root){
  const yd = Y();
  const wrap = document.createElement("div");

  const h = document.createElement("h2"); h.textContent = d.name;
  const sub = document.createElement("div"); sub.className="sub"; sub.textContent = d.sub + " · tutarlar kalem para biriminde girilir, özetler USD";
  wrap.append(h, sub);

  /* allocation strip */
  const a = yd.alloc[d.id];
  const ab = document.createElement("div"); ab.className="allocbox";
  const lbl = document.createElement("span"); lbl.className="lbl"; lbl.textContent="Bütçe alokasyonu (USD)";
  const modeSel = document.createElement("select"); modeSel.className="mini";
  [["fixed","Sabit tutar"],["pct","Net gelirin %'si"]].forEach(([v,t])=>{
    const o=document.createElement("option"); o.value=v; o.textContent=t; if(a.mode===v)o.selected=true; modeSel.appendChild(o);
  });
  modeSel.onchange = ()=>{ a.mode=modeSel.value; renderAll(); scheduleSave(); };
  ab.append(lbl, modeSel);
  if(a.mode==="pct"){
    const p = document.createElement("input"); p.type="number"; p.step="any"; p.style.width="70px";
    p.value = a.pct||""; p.placeholder="%";
    p.oninput = ()=>{ a.pct=num(p.value); recalcDept(d.id); scheduleSave(); };
    const ps = document.createElement("span"); ps.className="lbl"; ps.textContent="% oran";
    ab.append(p, ps);
  } else {
    const ps = document.createElement("span"); ps.className="lbl"; ps.textContent="aylık tutarlar tabloda ↓";
    ab.append(ps);
  }
  wrap.appendChild(ab);

  /* summary cards */
  const cards = document.createElement("div"); cards.className="cards"; cards.id = "cards-"+d.id;
  wrap.appendChild(cards);

  /* table */
  const tw = document.createElement("div"); tw.className="tblwrap";
  const tbl = document.createElement("table"); tbl.id = "tbl-"+d.id;
  const thead = document.createElement("thead"); thead.appendChild(headerRow(["Birim"]));
  const tbody = document.createElement("tbody");

  yd.expenses[d.id].forEach(it=>{
    /* plan row */
    const tr1 = document.createElement("tr"); tr1.className="item-plan";
    const nameTd = document.createElement("td");
    const nameIn = document.createElement("input"); nameIn.className="name-in"; nameIn.type="text"; nameIn.value=it.name;
    nameIn.oninput = ()=>{ it.name=nameIn.value; scheduleSave(); };
    const tag = document.createElement("span"); tag.className="rowtag"; tag.textContent="bütçe";
    nameTd.append(nameIn, tag);
    const curTd = document.createElement("td");
    const curSel = document.createElement("select"); curSel.className="cur-sel";
    CURS.forEach(c=>{ const o=document.createElement("option"); o.value=c;o.textContent=c; if(it.cur===c)o.selected=true; curSel.appendChild(o); });
    curSel.onchange = ()=>{ it.cur=curSel.value; recalcDept(d.id); scheduleSave(); };
    curTd.appendChild(curSel);
    tr1.append(nameTd, curTd, ...monthInputs(it.plan,"", ()=>recalcDept(d.id)));
    const t1 = document.createElement("td"); t1.className="itot-plan"; t1.dataset.item=it.id;
    const delTd = document.createElement("td");
    const del = document.createElement("button"); del.className="ghost"; del.textContent="✕"; del.title="Kalemi sil";
    del.onclick = ()=>{ yd.expenses[d.id] = yd.expenses[d.id].filter(x=>x.id!==it.id); renderAll(); scheduleSave(); };
    delTd.appendChild(del);
    tr1.append(t1, delTd);

    /* actual row */
    const tr2 = document.createElement("tr"); tr2.className="item-actual";
    const n2 = document.createElement("td");
    const tag2 = document.createElement("span"); tag2.className="rowtag"; tag2.textContent="gerçekleşen";
    n2.appendChild(tag2);
    const c2 = document.createElement("td");
    tr2.append(n2, c2, ...monthInputs(it.actual,"actual-in", ()=>recalcDept(d.id)));
    const t2 = document.createElement("td"); t2.className="itot-act"; t2.dataset.item=it.id;
    tr2.append(t2, document.createElement("td"));

    tbody.append(tr1, tr2);
  });

  /* summary rows */
  const mkSum = (cls, label) => {
    const tr = document.createElement("tr"); tr.className="sumrow "+cls;
    const td0 = document.createElement("td"); td0.textContent = label; tr.appendChild(td0);
    tr.appendChild(document.createElement("td"));
    for(let m=0;m<12;m++){ const td=document.createElement("td"); td.dataset.m=m; tr.appendChild(td); }
    const tt = document.createElement("td"); tt.dataset.m="t"; tr.appendChild(tt);
    tr.appendChild(document.createElement("td"));
    return tr;
  };
  const trAlloc = mkSum("alloc","Alokasyon (USD)");
  if(a.mode==="fixed"){
    /* editable fixed allocation */
    [...trAlloc.querySelectorAll("td[data-m]")].forEach(td=>{
      if(td.dataset.m==="t") return;
      const m = Number(td.dataset.m);
      const inp = document.createElement("input"); inp.type="number"; inp.step="any"; inp.className="mini-in";
      inp.value = a.fixed[m]===0?"":a.fixed[m]; inp.placeholder="0";
      inp.oninput = ()=>{ a.fixed[m]=num(inp.value); recalcDept(d.id); scheduleSave(); };
      td.textContent=""; td.appendChild(inp);
    });
  }
  const trPlan = mkSum("plansum","Harcama toplamı — Bütçe (USD)");
  const trAct  = mkSum("actsum","Harcama toplamı — Gerçekleşen (USD)");
  const trKal  = mkSum("kalan","Kalan fark (Alokasyon − Gerçekleşen)");
  tbody.append(trAlloc, trPlan, trAct, trKal);

  tbl.append(thead, tbody); tw.appendChild(tbl); wrap.appendChild(tw);

  const tb2 = document.createElement("div"); tb2.className="toolbar";
  const addB = document.createElement("button"); addB.textContent="+ Kalem ekle";
  addB.onclick = ()=>{ yd.expenses[d.id].push({id:uid(),name:"Yeni kalem",cur:"USD",plan:z12(),actual:z12()}); renderAll(); scheduleSave(); };
  tb2.appendChild(addB);
  wrap.appendChild(tb2);

  const hint = document.createElement("div"); hint.className="hint";
  hint.textContent = "Kur varsayımları Konsolide ekranından yönetilir. Gerçekleşen satırı boşsa fark hesabı yalnız alokasyona göre okunur.";
  wrap.appendChild(hint);

  root.appendChild(wrap);
  recalcDept(d.id);
}

function recalcDept(id){
  const tbl = document.getElementById("tbl-"+id);
  if(!tbl) return;
  const yd = Y();
  /* item totals */
  yd.expenses[id].forEach(it=>{
    const tp = tbl.querySelector('.itot-plan[data-item="'+it.id+'"]');
    const ta = tbl.querySelector('.itot-act[data-item="'+it.id+'"]');
    if(tp) tp.textContent = fmt(it.plan.reduce((s,v)=>s+num(v),0));
    if(ta) ta.textContent = fmt(it.actual.reduce((s,v)=>s+num(v),0));
  });
  /* summary rows */
  let tA=0,tP=0,tG=0,tK=0;
  const rows = {
    alloc: tbl.querySelector("tr.alloc"), plan: tbl.querySelector("tr.plansum"),
    act: tbl.querySelector("tr.actsum"), kal: tbl.querySelector("tr.kalan")
  };
  for(let m=0;m<12;m++){
    const A=allocUSD(id,m), P=deptPlanUSD(id,m), G=deptActualUSD(id,m), K=A-G;
    tA+=A;tP+=P;tG+=G;tK+=K;
    if(Y().alloc[id].mode==="pct"){
      const td = rows.alloc.querySelector('td[data-m="'+m+'"]'); if(td) td.textContent = fmt(A);
    }
    rows.plan.querySelector('td[data-m="'+m+'"]').textContent = fmt(P);
    rows.act.querySelector('td[data-m="'+m+'"]').textContent = fmt(G);
    const kt = rows.kal.querySelector('td[data-m="'+m+'"]');
    kt.textContent = fmtS(K); kt.className = K<0?"neg":"pos";
  }
  rows.alloc.querySelector('td[data-m="t"]').textContent = fmt(tA);
  rows.plan.querySelector('td[data-m="t"]').textContent = fmt(tP);
  rows.act.querySelector('td[data-m="t"]').textContent = fmt(tG);
  const ktt = rows.kal.querySelector('td[data-m="t"]');
  ktt.textContent = fmtS(tK); ktt.className = tK<0?"neg":"pos";
  /* cards */
  const cards = document.getElementById("cards-"+id);
  if(cards){
    cards.innerHTML = "";
    mkCard(cards,"Yıllık alokasyon","$"+fmt(tA),"brass");
    mkCard(cards,"Bütçelenen harcama","$"+fmt(tP),"");
    mkCard(cards,"Gerçekleşen","$"+fmt(tG),"");
    mkCard(cards,"Kalan fark","$"+fmtS(tK), tK<0?"neg":"pos");
  }
}

function mkCard(root,k,v,cls,n){
  const c = document.createElement("div"); c.className="card";
  c.innerHTML = '<div class="k"></div><div class="v"></div>' + (n?'<div class="n"></div>':'');
  c.querySelector(".k").textContent = k;
  const vv = c.querySelector(".v"); vv.textContent = v; if(cls) vv.classList.add(cls);
  if(n) c.querySelector(".n").textContent = n;
  root.appendChild(c);
}

/* ---------- revenue screen ---------- */
function renderRev(root){
  const yd = Y();
  const wrap = document.createElement("div");
  const h = document.createElement("h2"); h.textContent = "Platform Gelirleri";
  const sub = document.createElement("div"); sub.className="sub";
  sub.textContent = "Adet × birim fiyat (USD, KDV hariç net). Komisyon oranı kalem bazında parametriktir — MoR/Stripe kesintisi konsolideye otomatik yansır.";
  wrap.append(h, sub);

  const cards = document.createElement("div"); cards.className="cards"; cards.id="cards-rev";
  wrap.appendChild(cards);

  const tw = document.createElement("div"); tw.className="tblwrap";
  const tbl = document.createElement("table"); tbl.id="tbl-rev";
  const thead = document.createElement("thead");
  thead.appendChild(headerRow(["Birim fiyat $","Komisyon %"]));
  const tbody = document.createElement("tbody");

  yd.revenue.forEach(r=>{
    const tr = document.createElement("tr"); tr.className="item-plan";
    const nTd = document.createElement("td");
    const nIn = document.createElement("input"); nIn.className="name-in"; nIn.type="text"; nIn.value=r.name;
    nIn.oninput=()=>{ r.name=nIn.value; scheduleSave(); };
    const tag = document.createElement("span"); tag.className="rowtag"; tag.textContent="adet/ay";
    nTd.append(nIn, tag);
    const pTd = document.createElement("td");
    const pIn = document.createElement("input"); pIn.type="number"; pIn.step="any"; pIn.className="mini-in";
    pIn.value=r.price===0?"":r.price; pIn.placeholder="0";
    pIn.oninput=()=>{ r.price=num(pIn.value); recalcRev(); scheduleSave(); };
    pTd.appendChild(pIn);
    const cTd = document.createElement("td");
    const cIn = document.createElement("input"); cIn.type="number"; cIn.step="any"; cIn.className="mini-in";
    cIn.value=r.comm===0?"":r.comm; cIn.placeholder="0";
    cIn.oninput=()=>{ r.comm=num(cIn.value); recalcRev(); scheduleSave(); };
    cTd.appendChild(cIn);
    tr.append(nTd, pTd, cTd, ...monthInputs(r.qty,"",recalcRev));
    const tt = document.createElement("td"); tt.className="rtot"; tt.dataset.item=r.id;
    const dTd = document.createElement("td");
    const del = document.createElement("button"); del.className="ghost"; del.textContent="✕"; del.title="Kalemi sil";
    del.onclick=()=>{ yd.revenue = yd.revenue.filter(x=>x.id!==r.id); renderAll(); scheduleSave(); };
    dTd.appendChild(del);
    tr.append(tt, dTd);
    tbody.appendChild(tr);
  });

  const mkSum = (cls,label)=>{
    const tr=document.createElement("tr"); tr.className="sumrow "+cls;
    const td0=document.createElement("td"); td0.textContent=label; tr.appendChild(td0);
    tr.appendChild(document.createElement("td")); tr.appendChild(document.createElement("td"));
    for(let m=0;m<12;m++){ const td=document.createElement("td"); td.dataset.m=m; tr.appendChild(td); }
    const tt=document.createElement("td"); tt.dataset.m="t"; tr.appendChild(tt);
    tr.appendChild(document.createElement("td"));
    return tr;
  };
  const trG = mkSum("gross","Brüt gelir (USD)");
  const trC = mkSum("comm","Komisyon kesintisi");
  const trN = mkSum("net","Net gelir");
  trN.classList.add("grand");
  tbody.append(trG, trC, trN);
  tbl.append(thead, tbody); tw.appendChild(tbl); wrap.appendChild(tw);

  const tb = document.createElement("div"); tb.className="toolbar";
  const addB = document.createElement("button"); addB.textContent="+ Gelir kalemi ekle";
  addB.onclick=()=>{ yd.revenue.push({id:uid(),name:"Yeni gelir kalemi",price:0,comm:0,qty:z12()}); renderAll(); scheduleSave(); };
  tb.appendChild(addB);
  wrap.appendChild(tb);

  const hint = document.createElement("div"); hint.className="hint";
  hint.textContent="Sponsor gibi tek tutarlı gelirlerde birim fiyatı sözleşme tutarı, adedi 1 olarak girin. Komisyon referansları: Subscription (MoR) ~%7,5 · B2B reklam/sponsor (Stripe) ~%3,5 · Çarşı (Stripe Connect) ~%5.";
  wrap.appendChild(hint);
  root.appendChild(wrap);
  recalcRev();
}

function recalcRev(){
  scheduleSave();
  const tbl = document.getElementById("tbl-rev");
  if(!tbl) return;
  const yd = Y();
  yd.revenue.forEach(r=>{
    const tt = tbl.querySelector('.rtot[data-item="'+r.id+'"]');
    if(tt) tt.textContent = fmt(r.qty.reduce((s,v)=>s+num(v),0)*num(r.price));
  });
  let tG=0,tC=0,tN=0;
  const rG=tbl.querySelector("tr.gross"), rC=tbl.querySelector("tr.comm"), rN=tbl.querySelector("tr.net");
  for(let m=0;m<12;m++){
    const g=revGross(m), c=revComm(m), n=g-c;
    tG+=g;tC+=c;tN+=n;
    rG.querySelector('td[data-m="'+m+'"]').textContent = fmt(g);
    rC.querySelector('td[data-m="'+m+'"]').textContent = c?("−"+fmt(c)):"0";
    rN.querySelector('td[data-m="'+m+'"]').textContent = fmt(n);
  }
  rG.querySelector('td[data-m="t"]').textContent = fmt(tG);
  rC.querySelector('td[data-m="t"]').textContent = tC?("−"+fmt(tC)):"0";
  rN.querySelector('td[data-m="t"]').textContent = fmt(tN);
  const cards = document.getElementById("cards-rev");
  if(cards){
    cards.innerHTML="";
    mkCard(cards,"Yıllık brüt gelir","$"+fmt(tG),"");
    mkCard(cards,"Komisyon kesintisi","−$"+fmt(tC),"neg");
    mkCard(cards,"Yıllık net gelir","$"+fmt(tN),"brass");
    const eff = tG>0 ? (tC/tG*100).toFixed(1) : "0.0";
    mkCard(cards,"Efektif komisyon","%"+eff,"");
  }
}

/* ---------- consolidated ---------- */
function renderCons(root){
  const yd = Y();
  const wrap = document.createElement("div");
  const h = document.createElement("h2"); h.textContent="Konsolide Nakit Akışı";
  const sub = document.createElement("div"); sub.className="sub";
  sub.textContent = "Tüm tutarlar USD. Gelirler KDV hariç nettir; komisyonlar gelir kaleminin parametresinden düşülür.";
  wrap.append(h, sub);

  /* parameters */
  const par = document.createElement("div"); par.className="params";
  const mkParam = (label, val, onch) => {
    const p = document.createElement("div"); p.className="param";
    const l = document.createElement("label"); l.textContent = label;
    const i = document.createElement("input"); i.type="number"; i.step="any"; i.value = val===0?"":val; i.placeholder="0";
    i.oninput = ()=>{ onch(num(i.value)); renderConsBody(); scheduleSave(); };
    p.append(l,i); return p;
  };
  par.appendChild(mkParam("Açılış nakit bakiyesi $", yd.opening, v=>yd.opening=v));
  par.appendChild(mkParam("Kur · 1 EUR = ? USD", yd.fx.EUR, v=>yd.fx.EUR=v));
  par.appendChild(mkParam("Kur · 1 TRY = ? USD", yd.fx.TRY, v=>yd.fx.TRY=v));
  const bp = document.createElement("div"); bp.className="param";
  const bl = document.createElement("label"); bl.textContent="Gider bazı";
  const bs = document.createElement("select");
  [["plan","Bütçe (plan)"],["actual","Gerçekleşen"]].forEach(([v,t])=>{
    const o=document.createElement("option"); o.value=v; o.textContent=t; if(yd.basis===v)o.selected=true; bs.appendChild(o);
  });
  bs.onchange=()=>{ yd.basis=bs.value; renderConsBody(); scheduleSave(); };
  bp.append(bl,bs); par.appendChild(bp);
  wrap.appendChild(par);

  const cards = document.createElement("div"); cards.className="cards"; cards.id="cards-cons";
  wrap.appendChild(cards);

  /* runway ledger — signature */
  const rw = document.createElement("div"); rw.className="runway";
  rw.innerHTML = '<h3>Nakit pozisyonu · kümülatif</h3><div class="rw-bars" id="rwBars"></div><div class="rw-meta" id="rwMeta"></div>';
  wrap.appendChild(rw);

  const tw = document.createElement("div"); tw.className="tblwrap";
  const tbl = document.createElement("table"); tbl.id="tbl-cons";
  wrap.appendChild(tw); tw.appendChild(tbl);

  const hint = document.createElement("div"); hint.className="hint";
  hint.textContent = "Runway: kümülatif nakdin eksiye döndüğü ilk aya kadar kalan süre. Gider bazı 'Bütçe' iken plan senaryosunu, 'Gerçekleşen' iken fiili durumu okursunuz.";
  wrap.appendChild(hint);

  root.appendChild(wrap);
  renderConsBody();
}

function renderConsBody(){
  const yd = Y();
  const tbl = document.getElementById("tbl-cons");
  if(!tbl) return;
  const basis = yd.basis;
  const dep = (id,m) => basis==="actual" ? deptActualUSD(id,m) : deptPlanUSD(id,m);

  const rows = [];
  rows.push({type:"head", label:"GELİRLER"});
  yd.revenue.forEach(r=>{
    rows.push({label:r.name+" (brüt)", vals:MONTHS.map((_,m)=>num(r.qty[m])*num(r.price))});
  });
  rows.push({label:"Komisyon kesintisi", vals:MONTHS.map((_,m)=>-revComm(m)), cls:"neg"});
  rows.push({label:"Net gelir", vals:MONTHS.map((_,m)=>revNet(m)), sum:true});
  rows.push({type:"head", label:"GİDERLER · "+(basis==="actual"?"gerçekleşen":"bütçe")});
  DEPTS.forEach(d=>{
    rows.push({label:d.name, vals:MONTHS.map((_,m)=>-dep(d.id,m)), cls:"neg"});
  });
  rows.push({label:"Toplam gider", vals:MONTHS.map((_,m)=>-DEPTS.reduce((s,d)=>s+dep(d.id,m),0)), sum:true, cls:"neg"});

  const net = MONTHS.map((_,m)=> revNet(m) - DEPTS.reduce((s,d)=>s+dep(d.id,m),0));
  rows.push({label:"Aylık net nakit akışı", vals:net, grand:true, signed:true});
  const cum = []; let acc = num(yd.opening);
  net.forEach(v=>{ acc+=v; cum.push(acc); });
  rows.push({label:"Kümülatif nakit (açılış dahil)", vals:cum, grand:true, signed:true, nototal:true});

  /* build table */
  tbl.innerHTML = "";
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  ["Kalem",...MONTHS,"Yıl toplamı"].forEach(c=>{ const th=document.createElement("th"); th.textContent=c; trh.appendChild(th); });
  thead.appendChild(trh); tbl.appendChild(thead);
  const tbody = document.createElement("tbody");
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    if(r.type==="head"){
      tr.className="section-head";
      const td = document.createElement("td"); td.textContent=r.label; td.colSpan=14;
      tr.appendChild(td); tbody.appendChild(tr); return;
    }
    if(r.sum) tr.className="sumrow";
    if(r.grand) tr.className="grand";
    const td0 = document.createElement("td"); td0.textContent=r.label;
    if(!r.grand && !r.sum) td0.classList.add("rowlabel");
    tr.appendChild(td0);
    let tot=0;
    r.vals.forEach(v=>{
      tot+=v;
      const td = document.createElement("td");
      td.textContent = fmtS(v);
      if(r.signed) td.className = v<0?"neg":"pos";
      else if(r.cls) td.className = r.cls;
      tr.appendChild(td);
    });
    const tt = document.createElement("td");
    if(r.nototal){ tt.textContent = "→ $"+fmtS(r.vals[11]); tt.className = r.vals[11]<0?"neg":"pos"; }
    else { tt.textContent = fmtS(tot); if(r.signed) tt.className = tot<0?"neg":"pos"; else if(r.cls) tt.className=r.cls; }
    tr.appendChild(tt);
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);

  /* cards + runway */
  const totalNetRev = MONTHS.reduce((s,_,m)=>s+revNet(m),0);
  const totalExp = MONTHS.reduce((s,_,m)=>s+DEPTS.reduce((x,d)=>x+dep(d.id,m),0),0);
  const yearNet = totalNetRev-totalExp;
  const endCash = cum[11];
  const cards = document.getElementById("cards-cons");
  cards.innerHTML="";
  mkCard(cards,"Yıllık net gelir","$"+fmt(totalNetRev),"");
  mkCard(cards,"Yıllık toplam gider","$"+fmt(totalExp),"");
  mkCard(cards,"Yıllık net akış","$"+fmtS(yearNet), yearNet<0?"neg":"pos");
  mkCard(cards,"Yıl sonu nakit","$"+fmtS(endCash), endCash<0?"neg":"pos");

  /* runway bars */
  const bars = document.getElementById("rwBars");
  bars.innerHTML="";
  const maxAbs = Math.max(1, ...cum.map(v=>Math.abs(v)));
  cum.forEach((v,m)=>{
    const col = document.createElement("div"); col.className="rw-col";
    const val = document.createElement("div"); val.className="rw-v"; val.textContent = fmt(Math.abs(v)/1000)+"k";
    const bar = document.createElement("div"); bar.className="rw-bar"+(v<0?" neg":"");
    bar.style.height = Math.max(3, Math.abs(v)/maxAbs*84)+"px";
    const ml = document.createElement("div"); ml.className="rw-m"; ml.textContent=MONTHS[m];
    col.append(val,bar,ml);
    bars.appendChild(col);
  });
  /* runway calc */
  const meta = document.getElementById("rwMeta");
  meta.innerHTML="";
  let runwayTxt = "12+ ay (yıl içinde eksiye düşmüyor)";
  const firstNeg = cum.findIndex(v=>v<0);
  if(firstNeg>=0) runwayTxt = firstNeg===0 ? "Oca itibarıyla negatif" : firstNeg+" ay ("+MONTHS[firstNeg]+" ayında eksiye düşer)";
  const burn = net.filter(v=>v<0);
  const avgBurn = burn.length? Math.abs(burn.reduce((s,v)=>s+v,0)/burn.length) : 0;
  const mkMeta = (k,v,cls)=>{
    const d = document.createElement("div");
    const kk = document.createElement("span"); kk.className="k"; kk.textContent=k;
    const vv = document.createElement("span"); vv.textContent=v; if(cls) vv.style.color="var(--"+cls+")";
    d.append(kk,vv); meta.appendChild(d);
  };
  mkMeta("Runway", runwayTxt, firstNeg>=0?"neg":"pos");
  mkMeta("Ortalama aylık burn", avgBurn? "$"+fmt(avgBurn) : "—");
  mkMeta("Açılış bakiyesi","$"+fmt(yd.opening));
}

/* ---------- CSV export ---------- */
function exportCSV(){
  const yd = Y();
  const basis = yd.basis;
  const dep = (id,m)=> basis==="actual"?deptActualUSD(id,m):deptPlanUSD(id,m);
  const esc = s => '"'+String(s).replace(/"/g,'""')+'"';
  const lines = [];
  lines.push([esc("CorteQS Konsolide Nakit Akışı"), esc(state.activeYear), esc("Baz: "+(basis==="actual"?"Gerçekleşen":"Bütçe")), esc("USD")].join(","));
  lines.push([esc("Kalem"),...MONTHS.map(esc),esc("Yıl toplamı")].join(","));
  const row = (label, vals) => {
    const t = vals.reduce((s,v)=>s+v,0);
    lines.push([esc(label),...vals.map(v=>Math.round(v)),Math.round(t)].join(","));
  };
  yd.revenue.forEach(r=> row(r.name+" (brüt)", MONTHS.map((_,m)=>num(r.qty[m])*num(r.price))));
  row("Komisyon kesintisi", MONTHS.map((_,m)=>-revComm(m)));
  row("Net gelir", MONTHS.map((_,m)=>revNet(m)));
  DEPTS.forEach(d=> row(d.name, MONTHS.map((_,m)=>-dep(d.id,m))));
  row("Toplam gider", MONTHS.map((_,m)=>-DEPTS.reduce((s,dd)=>s+dep(dd.id,m),0)));
  const net = MONTHS.map((_,m)=>revNet(m)-DEPTS.reduce((s,dd)=>s+dep(dd.id,m),0));
  row("Aylık net nakit akışı", net);
  let acc=num(yd.opening); const cum=net.map(v=>acc+=v);
  lines.push([esc("Kümülatif nakit"),...cum.map(v=>Math.round(v)),""].join(","));
  const blob = new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "corteqs-butce-"+state.activeYear+".csv";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- render root ---------- */
function renderAll(){
  renderTabs(); renderYearSel();
  const main = document.getElementById("main");
  main.innerHTML = "";
  const sc = document.createElement("div"); sc.className="screen active";
  main.appendChild(sc);
  const t = state.activeTab;
  if(t==="rev") renderRev(sc);
  else if(t==="cons") renderCons(sc);
  else {
    const d = DEPTS.find(x=>x.id===t) || DEPTS[0];
    renderDept(d, sc);
  }
}

/* ---------- init ---------- */
(async function(){
  await loadState();
  if(!state.years[state.activeYear]) state.years[state.activeYear] = seedYear();
  document.getElementById("csvBtn").onclick = exportCSV;
  renderAll();
})();

</script>
